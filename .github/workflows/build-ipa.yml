name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          LATEST_XCODE=$(ls /Applications | grep -E '^Xcode_[0-9]+\.[0-9]+(\.[0-9]+)?\.app$' | sort -V | tail -n1)
          echo "Gevonden: $LATEST_XCODE"
          sudo xcode-select -s "/Applications/$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Locate project.yml
        id: locate
        run: |
          FOUND=$(find . -name project.yml -not -path '*/build/*' | head -n1)
          if [ -z "$FOUND" ]; then
            echo "Kon project.yml nergens vinden in de repo!"
            find . -maxdepth 4 -type f
            exit 1
          fi
          PROJECT_DIR=$(dirname "$FOUND")
          echo "project.yml gevonden in: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Generate Xcode project
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          xcodegen generate

      - name: Build unsigned .app for a real iPhone
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          xcodebuild build \
            -project NinebotApp.xcodeproj \
            -scheme NinebotApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into .ipa
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          mkdir -p Payload
          cp -r "build/Build/Products/Release-iphoneos/NinebotApp.app" Payload/
          zip -r NinebotApp-unsigned.ipa Payload

      - name: Upload IPA as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NinebotApp-unsigned-ipa
          path: ${{ steps.locate.outputs.project_dir }}/NinebotApp-unsigned.ipa
          retention-days: 14
